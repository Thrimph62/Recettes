<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Recettes de famille</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0f2d5a;--navy2:#1a4a8a;--navy3:#5a86c4;
  --ice:#e8f0fb;--border:#c8d9f0;
  --text:#1a1a2e;--muted:#5a6a8a;
  --bg:#f0f2f7;--white:#fff;
  --green:#1a7a4a;--red:#a02020;--gold:#b8860b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:1rem;
}

/* Subtle background pattern */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(15,45,90,.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(90,134,196,.06) 0%, transparent 60%);
  pointer-events:none;
}

.login-wrap{
  width:100%;max-width:400px;
  position:relative;z-index:1;
}

/* Brand */
.login-brand{
  text-align:center;
  margin-bottom:2rem;
}
.brand-icon{
  font-size:42px;
  margin-bottom:10px;
  filter:drop-shadow(0 2px 8px rgba(15,45,90,.15));
}
.brand-name{
  font-family:'DM Serif Display',serif;
  font-size:26px;font-weight:400;
  color:var(--navy);
  margin-bottom:4px;
}
.brand-sub{
  font-size:13px;
  color:var(--muted);
  letter-spacing:.03em;
}

/* Card */
.login-card{
  background:var(--white);
  border:0.5px solid var(--border);
  border-radius:16px;
  padding:2rem 2rem 1.75rem;
  box-shadow:0 8px 32px rgba(15,45,90,.1);
}

.field{margin-bottom:1.25rem;}
.field-label{
  display:block;
  font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);
  margin-bottom:6px;
}
.field-input{
  width:100%;
  padding:11px 14px;
  border:1.5px solid var(--border);
  border-radius:8px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:var(--text);
  background:var(--white);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.field-input:focus{
  border-color:var(--navy3);
  box-shadow:0 0 0 3px rgba(90,134,196,.12);
}

.btn-login{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--navy);
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:600;
  cursor:pointer;
  transition:background .15s, transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:.25rem;
}
.btn-login:hover{background:var(--navy2);}
.btn-login:active{transform:scale(.99);}
.btn-login:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none;}

/* Spinner */
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .65s linear infinite;
  display:none;
}
.btn-login.loading .spinner{display:block;}
.btn-login.loading .btn-text{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Message */
.msg{
  margin-top:.875rem;
  padding:10px 14px;
  border-radius:8px;
  font-size:13px;
  text-align:center;
  display:none;
}
.msg.error{background:#fef0f0;color:var(--red);border:0.5px solid #f0c0c0;display:block;}
.msg.success{background:#edfaf3;color:var(--green);border:0.5px solid #a0ddc0;display:block;}

/* Footer */
.login-footer{
  text-align:center;
  margin-top:1.25rem;
  font-size:11px;
  color:var(--muted);
  letter-spacing:.03em;
}
.login-footer span{
  display:inline-block;
  width:4px;height:4px;
  background:var(--border);
  border-radius:50%;
  vertical-align:middle;
  margin:0 6px;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="brand-icon">🍽️</div>
    <div class="brand-name">Recettes de famille</div>
    <div class="brand-sub">Espace privé</div>
  </div>

  <div class="login-card">
    <div class="field">
      <label class="field-label" for="email">Adresse e-mail</label>
      <input class="field-input" type="email" id="email"
        placeholder="votre@email.com"
        autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label class="field-label" for="password">Mot de passe</label>
      <input class="field-input" type="password" id="password"
        placeholder="••••••••"
        autocomplete="current-password">
    </div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">
      <div class="spinner"></div>
      <span class="btn-text">Se connecter</span>
    </button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="login-footer">
    Recettes de famille<span></span>Accès privé
  </div>
</div>

<script>
const SB_URL = 'https://wcmbbgkjjlohxviwjivm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbWJiZ2tqamxvaHh2aXdqaXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDk5NTMsImV4cCI6MjA5MjE4NTk1M30.CUf2regwchLkDtCPnQn-lkVBMR42LKkvMQs3QEUfdMs';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

// Already logged in → skip login page
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) goToApp();
})();

// Enter key submits
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  const msg      = document.getElementById('msg');

  if (!email || !password) {
    showMsg('error', 'Veuillez remplir tous les champs.');
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;
  msg.className = 'msg';
  msg.style.display = 'none';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    showMsg('success', '✓ Connexion réussie…');
    setTimeout(goToApp, 600);
  } catch(e) {
    let errMsg = 'Email ou mot de passe incorrect.';
    if (e.message?.includes('Invalid login')) errMsg = 'Email ou mot de passe incorrect.';
    else if (e.message?.includes('Email not confirmed')) errMsg = 'Email non confirmé.';
    else if (e.message?.includes('network')) errMsg = 'Erreur réseau — réessayez.';
    showMsg('error', errMsg);
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + type;
  el.textContent = text;
}

function goToApp() {
  const params = new URLSearchParams(window.location.search);
  const returnTo = params.get('returnTo');
  window.location.href = returnTo ? decodeURIComponent(returnTo) : 'index.html';
}
</script>
</body>
</html>
